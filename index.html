<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Field Log — Conservation Site Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <aside id="log">
    <header class="log-header">
      <span class="eyebrow">FIELD LOG</span>
      <h1>Site Register</h1>
      <p class="subtitle">Toggle layers on or off, search across all visible features.</p>
    </header>

    <div class="controls">
      <input id="search" type="text" placeholder="Search sites..." autocomplete="off" />
      <div id="filters" class="layer-toggles"></div>
    </div>

    <ol id="entries" class="entries"></ol>

    <footer class="log-footer">
      <span id="count">0 entries</span>
    </footer>
  </aside>

  <main id="map"></main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="script.js"></script>
</body>
</html>
